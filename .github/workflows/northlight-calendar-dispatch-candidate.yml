name: Northlight Calendar Dispatcher Candidate

on:
  push:
    branches:
      - northlight-combined-verify-20260821
  pull_request:
    branches:
      - northlight-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-dispatch-candidate:
    name: Verify exact Calendar dispatcher candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: fe22a68dcd2f7fec8112cb5b078d747c7555a008
      EXPECTED_BASE: 7a6947fa763b7aec169fc3f5b079494a00f49d93
      EXPECTED_PRODUCTION: 1c9696a463c2d12acf5b5ffe839bd8aa9d75f80f
    steps:
      - name: Checkout exact Calendar candidate
        uses: actions/checkout@v6
        with:
          ref: northlight-hardening-calendar-dispatch-20260821
          fetch-depth: 0

      - name: Prove exact candidate, ancestry, scope and production freeze
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'northlight-hardening-calendar-dispatch-20260821'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$EXPECTED_HEAD"
          remote_candidate="$(git ls-remote --heads origin refs/heads/northlight-hardening-calendar-dispatch-20260821 | awk '{print $1}')"
          production="$(git ls-remote --heads origin refs/heads/northlight-production | awk '{print $1}')"
          test "$remote_candidate" = "$EXPECTED_HEAD"
          test "$production" = "$EXPECTED_PRODUCTION"
          changed="$(git diff --name-only "$EXPECTED_BASE" "$EXPECTED_HEAD")"
          expected=$'tests/durable-dispatcher.test.mjs\nworkers/integration-dispatcher/src/index.js'
          test "$changed" = "$expected"
          git diff --check "$EXPECTED_BASE" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git fsck --no-reflogs --connectivity-only "$EXPECTED_HEAD"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Calendar dispatcher regression contract
        run: node --test tests/durable-dispatcher.test.mjs

      - name: Run complete Northlight test suite
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/northlight-calendar-tests.log
          grep -E '^# (tests|pass|fail|skipped|cancelled|todo) ' /tmp/northlight-calendar-tests.log || true

      - name: Build exact candidate with authoritative identity
        run: |
          set -euo pipefail
          CF_PAGES_COMMIT_SHA="$EXPECTED_HEAD" \
          CF_PAGES_BRANCH='northlight-hardening-calendar-dispatch-20260821' \
          npm run build 2>&1 | tee /tmp/northlight-calendar-build.log
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test "$status" = ' M functions/_lib/build-info.js'
          grep -Fq "\"commitSha\":\"$EXPECTED_HEAD\"" functions/_lib/build-info.js
          grep -Fq '"branch":"northlight-hardening-calendar-dispatch-20260821"' functions/_lib/build-info.js
          git restore --source=HEAD -- functions/_lib/build-info.js
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Validate Cloudflare dispatcher bundle and bindings
        run: npm run check:dispatcher

      - name: Re-prove candidate and production refs after all gates
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git ls-remote --heads origin refs/heads/northlight-hardening-calendar-dispatch-20260821 | awk '{print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote --heads origin refs/heads/northlight-production | awk '{print $1}')" = "$EXPECTED_PRODUCTION"

      - name: Upload Calendar candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northlight-calendar-dispatch-${{ github.run_id }}
          path: |
            /tmp/northlight-calendar-tests.log
            /tmp/northlight-calendar-build.log
          if-no-files-found: ignore
          retention-days: 30
