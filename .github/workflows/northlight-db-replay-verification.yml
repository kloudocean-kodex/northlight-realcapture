name: Northlight DB Replay Verification

on:
  push:
    branches:
      - 'northlight-db-replay-*'
  pull_request:
    branches:
      - northlight-production

permissions:
  contents: read

jobs:
  database-replay:
    name: PostgreSQL 17 clean-room replay
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: northlight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d northlight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/northlight
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify bundle identity
        run: |
          set -euo pipefail
          expected='d5691f1ba0005dffa14be82a74afad4c06d7abb5fa8042f12eeabe197435093d'
          actual="$(sha256sum ci/northlight-db-replay-bundle.tar.gz | awk '{print $1}')"
          echo "Bundle SHA-256: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Bundle SHA-256 mismatch; expected $expected, got $actual"
            exit 1
          fi

      - name: Expand secret-scanned database candidate bundle
        run: tar -xzf ci/northlight-db-replay-bundle.tar.gz

      - name: Verify PostgreSQL tools
        run: |
          set -euo pipefail
          psql --version
          pg_dump --version
          pg_restore --version

      - name: Verify migration and recovery manifests
        run: node scripts/verify-database-manifests.mjs

      - name: Replay from empty PostgreSQL 17
        run: bash scripts/database-replay.sh
