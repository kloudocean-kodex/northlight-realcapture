name: Northlight DB Replay Verification

on:
  push:
    branches:
      - 'northlight-db-replay-*'
  pull_request:
    branches:
      - northlight-production

permissions:
  contents: read

jobs:
  database-replay:
    name: PostgreSQL 17 clean-room replay
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: northlight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d northlight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/northlight
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v6

      - name: Fetch exact secret-scanned replay text from shared evidence Drive
        run: |
          set -euo pipefail
          replay_url='https://drive.usercontent.google.com/download?id=1IJiqZwOnzAvNwmEoJ4aPFxfLDQ4n8vjH&export=download&confirm=t'
          manifest_url='https://drive.usercontent.google.com/download?id=1mDA66pCQypzNuORRbred6-yY3B0imziB&export=download&confirm=t'
          curl --location --fail --silent --show-error --max-time 60 "$replay_url" -o /tmp/northlight-db-replay.sql
          curl --location --fail --silent --show-error --max-time 30 "$manifest_url" -o /tmp/northlight-db-replay-source-manifest.json
          test "$(wc -c </tmp/northlight-db-replay.sql)" -eq 390641
          test "$(wc -c </tmp/northlight-db-replay-source-manifest.json)" -eq 10904

      - name: Verify replay provenance
        run: |
          set -euo pipefail
          echo '1ebb0231fa52c8f89dc1b1e9f6836bdffd3a272b60273fcb24814b01259c755a  /tmp/northlight-db-replay.sql' | sha256sum --check --strict
          echo '8d140fd2ef7fe1a20df8179569ee1d55d5c92b16043b5c7d703c2d55f5f36a9b  /tmp/northlight-db-replay-source-manifest.json' | sha256sum --check --strict
          node -e "const fs=require('fs'),d=JSON.parse(fs.readFileSync('/tmp/northlight-db-replay-source-manifest.json')); if(d.sourceCheckpoint!=='5f26a32c15bc7394ed2c7aee22b0c42ea3b180f5'||d.files.length!==51||d.verificationRevision!=='server-only-zero-policies-v6') process.exit(1); console.log('Replay manifest:', d.files.length, 'ordered inputs from checkpoint', d.sourceCheckpoint, d.verificationRevision);"

      - name: Verify PostgreSQL 17 server and client image
        run: |
          set -euo pipefail
          server_version="$(psql "$DATABASE_URL" -X -Atqc 'show server_version;')"
          echo "PostgreSQL server: $server_version"
          case "$server_version" in 17.*) ;; *) echo "::error::Expected PostgreSQL 17 server"; exit 1;; esac
          docker run --rm postgres:17 psql --version
          docker run --rm postgres:17 pg_dump --version
          docker run --rm postgres:17 pg_restore --version

      - name: Execute complete clean-room replay and contracts
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v /tmp:/work:ro \
            -e PGPASSWORD=postgres \
            postgres:17 \
            psql -h 127.0.0.1 -U postgres -d northlight -X -v ON_ERROR_STOP=1 \
              -f /work/northlight-db-replay.sql

      - name: Logical backup and restore rehearsal with PostgreSQL 17 tools
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v /tmp:/work \
            -e PGPASSWORD=postgres \
            postgres:17 \
            pg_dump -h 127.0.0.1 -U postgres -d northlight \
              --format=custom --no-owner --no-privileges \
              --file=/work/northlight-cleanroom.dump
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:17 \
            createdb -h 127.0.0.1 -U postgres northlight_restore
          docker run --rm --network host \
            -v /tmp:/work:ro \
            -e PGPASSWORD=postgres \
            postgres:17 \
            pg_restore -h 127.0.0.1 -U postgres -d northlight_restore \
              --no-owner --no-privileges /work/northlight-cleanroom.dump
          original="$(psql "$DATABASE_URL" -X -Atqc "select count(*) from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','northlight_private') and c.relkind in ('r','p','v','m','S','f');")"
          restored="$(psql postgresql://postgres:postgres@127.0.0.1:5432/northlight_restore -X -Atqc "select count(*) from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','northlight_private') and c.relkind in ('r','p','v','m','S','f');")"
          echo "Catalog relation count original=$original restored=$restored"
          test "$original" = "$restored"

      - name: Execute concurrent-session race contracts
        run: bash ci/northlight-db-concurrency.sh
