name: Northlight DB Replay Verification

on:
  push:
    branches:
      - 'northlight-db-replay-*'
  pull_request:
    branches:
      - northlight-production

permissions:
  contents: read

jobs:
  database-replay:
    name: PostgreSQL 17 clean-room replay
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: northlight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d northlight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/northlight
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v6

      - name: Fetch exact secret-scanned replay text from shared evidence Drive
        run: |
          set -euo pipefail
          replay_url='https://drive.usercontent.google.com/download?id=1OsrQvKAAxPzMElVOwOOzp9A3dNFkrqL2&export=download&confirm=t'
          manifest_url='https://drive.usercontent.google.com/download?id=1oSY8uoae6sBZd5fpBGbgY4P7W3oSDZdh&export=download&confirm=t'
          curl --location --fail --silent --show-error --max-time 60 "$replay_url" -o /tmp/northlight-db-replay.sql
          curl --location --fail --silent --show-error --max-time 30 "$manifest_url" -o /tmp/northlight-db-replay-source-manifest.json
          test "$(wc -c </tmp/northlight-db-replay.sql)" -eq 387100
          test "$(wc -c </tmp/northlight-db-replay-source-manifest.json)" -eq 10724

      - name: Verify replay provenance
        run: |
          set -euo pipefail
          echo '6d0e27e8731204f60df7bce19298d4dc1b3bc8c1dbe5244fdf6b8a8a21dac3fe  /tmp/northlight-db-replay.sql' | sha256sum --check --strict
          echo '6d9952f7b59e675f3b0ead080382b10f407519d90a783e1de95edabae5b1dd4f  /tmp/northlight-db-replay-source-manifest.json' | sha256sum --check --strict
          node -e "const fs=require('fs'),d=JSON.parse(fs.readFileSync('/tmp/northlight-db-replay-source-manifest.json')); if(d.sourceCheckpoint!=='5f26a32c15bc7394ed2c7aee22b0c42ea3b180f5'||d.files.length!==51) process.exit(1); console.log('Replay manifest:', d.files.length, 'ordered inputs from checkpoint', d.sourceCheckpoint);"

      - name: Verify PostgreSQL tools
        run: |
          set -euo pipefail
          psql --version
          pg_dump --version
          pg_restore --version

      - name: Execute complete clean-room replay and contracts
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f /tmp/northlight-db-replay.sql

      - name: Logical backup and restore rehearsal
        run: |
          set -euo pipefail
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file=/tmp/northlight-cleanroom.dump
          createdb postgresql://postgres:postgres@127.0.0.1:5432/northlight_restore
          pg_restore --dbname=postgresql://postgres:postgres@127.0.0.1:5432/northlight_restore --no-owner --no-privileges /tmp/northlight-cleanroom.dump
          original="$(psql "$DATABASE_URL" -X -Atqc "select count(*) from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','northlight_private') and c.relkind in ('r','p','v','m','S','f');")"
          restored="$(psql postgresql://postgres:postgres@127.0.0.1:5432/northlight_restore -X -Atqc "select count(*) from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','northlight_private') and c.relkind in ('r','p','v','m','S','f');")"
          echo "Catalog relation count original=$original restored=$restored"
          test "$original" = "$restored"
