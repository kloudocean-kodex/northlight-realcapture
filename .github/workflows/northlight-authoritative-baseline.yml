name: Northlight Authoritative Remediation Baseline

on:
  push:
    branches:
      - northlight-combined-verify-20260821
  pull_request:
    branches:
      - northlight-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoritative-baseline:
    name: Baseline exact remediation head
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: 0174819c4969bc083416b0f4df79402969e0baf4
      RECOVERED_BASE: 7a6947fa763b7aec169fc3f5b079494a00f49d93
      CHECKPOINT: 5f26a32c15bc7394ed2c7aee22b0c42ea3b180f5
      CHECKPOINT_TREE: 9d2058d9f68b3bf8dac6755d94820cb6aaacabf2
      EXPECTED_PRODUCTION: 1c9696a463c2d12acf5b5ffe839bd8aa9d75f80f
    steps:
      - name: Checkout authoritative remediation branch
        uses: actions/checkout@v6
        with:
          ref: remediation/ultimate-production-20260819
          fetch-depth: 0

      - name: Prove branch, lineage and production freeze
        run: |
          set -euo pipefail
          branch="$(git branch --show-current)"
          head="$(git rev-parse HEAD)"
          checkpoint_tree="$(git show -s --format=%T "$CHECKPOINT")"
          prod="$(git ls-remote --heads origin refs/heads/northlight-production | awk '{print $1}')"
          remote_rc="$(git ls-remote --heads origin refs/heads/remediation/ultimate-production-20260819 | awk '{print $1}')"
          echo "Branch: $branch"
          echo "HEAD: $head"
          echo "Recovered base: $RECOVERED_BASE"
          echo "Checkpoint: $CHECKPOINT"
          echo "Production: $prod"
          test "$branch" = 'remediation/ultimate-production-20260819'
          test "$head" = "$EXPECTED_HEAD"
          test "$checkpoint_tree" = "$CHECKPOINT_TREE"
          test "$remote_rc" = "$EXPECTED_HEAD"
          test "$prod" = "$EXPECTED_PRODUCTION"
          git merge-base --is-ancestor "$CHECKPOINT" "$RECOVERED_BASE"
          git merge-base --is-ancestor "$RECOVERED_BASE" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git fsck --no-reflogs --connectivity-only "$EXPECTED_HEAD"

      - name: Prove recovered manifest correction stayed exact
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$CHECKPOINT" "$RECOVERED_BASE")"
          test "$changed" = 'supabase/schema-contract.json'
          stats="$(git diff --numstat "$CHECKPOINT" "$RECOVERED_BASE" -- supabase/schema-contract.json)"
          echo "Manifest correction stats: $stats"
          test "$stats" = $'1\t1\tsupabase/schema-contract.json'
          grep -Fq '"20260821142000_northlight_same_tenant_integrity.sql": "1b67f9872e335622385d1469b4ef2e08269181ec693e72e8f012408108ab8983"' supabase/schema-contract.json

      - name: Prove Calendar hardening scope and Cloudflare config boundary
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$RECOVERED_BASE" "$EXPECTED_HEAD" | sort)"
          expected=$'tests/durable-dispatcher.test.mjs\nworkers/integration-dispatcher/src/index.js\nwrangler.jsonc'
          test "$changed" = "$expected"
          node <<'NODE'
          const fs=require('node:fs');
          const pages=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const worker=JSON.parse(fs.readFileSync('workers/integration-dispatcher/wrangler.jsonc','utf8'));
          if(Object.hasOwn(pages,'observability')) throw new Error('pages_observability_must_be_absent');
          if(pages?.queues?.producers?.[0]?.binding!=='TASK_HANDOFF_QUEUE') throw new Error('pages_queue_binding_missing');
          if(worker?.observability?.enabled!==true || worker?.observability?.traces?.enabled!==true) throw new Error('worker_observability_missing');
          if(worker?.queues?.consumers?.[0]?.queue!=='northlight-task-handoffs') throw new Error('worker_queue_consumer_missing');
          NODE

      - name: Verify mandatory checkpoint documents are present
        run: |
          set -euo pipefail
          test -s docs/CHECKPOINT-2026-08-21.md
          test -s docs/database-reproducibility-plan.md
          grep -Fq 'remediation/ultimate-production-20260819' docs/CHECKPOINT-2026-08-21.md
          grep -Fq 'not yet reproducible from an empty Supabase project' docs/database-reproducibility-plan.md
          echo 'Mandatory checkpoint documents present and non-empty.'

      - name: Verify diff whitespace and tracked-file hygiene before install
        run: |
          set -euo pipefail
          git diff --check "$CHECKPOINT" "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const fs=require('node:fs');
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const forbiddenFiles=files.filter(f=>/(^|\/)(\.env(?:\..*)?|\.dev\.vars|id_(?:rsa|ed25519)|[^/]+\.(?:pem|p12|pfx|key))$/i.test(f)&&!/(^|\/)\.env\.example$/i.test(f));
          const patterns=[
            ['GitHub token',/\bgh[pousr]_[A-Za-z0-9_]{30,}\b/g],
            ['Slack token',/\bxox[baprs]-[A-Za-z0-9-]{20,}\b/g],
            ['AWS access key',/\bAKIA[0-9A-Z]{16}\b/g],
            ['private key',/-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/g]
          ];
          const findings=[];
          for(const file of files){
            let buf;try{buf=fs.readFileSync(file)}catch{continue}
            if(buf.includes(0))continue;
            const text=buf.toString('utf8');
            for(const [label,re] of patterns){re.lastIndex=0;if(re.test(text))findings.push(`${file}: ${label}`)}
          }
          for(const file of forbiddenFiles)findings.push(`${file}: sensitive filename tracked`);
          if(findings.length){
            console.error('High-confidence tracked-secret hygiene findings (values intentionally suppressed):');
            for(const finding of findings)console.error(`- ${finding}`);
            process.exit(1);
          }
          console.log(`Tracked-secret hygiene scan: ${files.length} tracked files checked; no high-confidence finding.`);
          NODE

      - name: Verify recipient configuration contract
        run: |
          set -euo pipefail
          obsolete='realcapture.mel@gmail.com'
          current='pradeeppatilfg@gmail.com'
          if git grep -n -F "$obsolete" -- . ':(exclude).git' > /tmp/obsolete-recipient.txt; then
            echo '::error::Obsolete operations recipient remains in tracked repository paths:'
            cut -d: -f1-2 /tmp/obsolete-recipient.txt | sort -u
            exit 1
          fi
          current_count="$(git grep -n -F "$current" -- . ':(exclude).git' | wc -l | tr -d ' ')"
          echo "Authoritative current-recipient references: $current_count"
          test "$current_count" -ge 1

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run actual test suite
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/northlight-tests.log
          grep -E '^# (tests|pass|fail|skipped|cancelled|todo) ' /tmp/northlight-tests.log || true

      - name: Run actual build and syntax checks with authoritative build identity
        run: |
          set -euo pipefail
          CF_PAGES_COMMIT_SHA="$EXPECTED_HEAD" \
          CF_PAGES_BRANCH='remediation/ultimate-production-20260819' \
          npm run build 2>&1 | tee /tmp/northlight-build.log

      - name: Verify generated build metadata is the only build mutation, then restore source tree
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'Post-build tracked status:\n%s\n' "$status"
          test "$status" = ' M functions/_lib/build-info.js'
          grep -Fq "\"commitSha\":\"$EXPECTED_HEAD\"" functions/_lib/build-info.js
          grep -Fq '"branch":"remediation/ultimate-production-20260819"' functions/_lib/build-info.js
          test -s dist/build-info.json
          grep -Fq "\"commitSha\":\"$EXPECTED_HEAD\"" dist/build-info.json
          grep -Fq '"branch":"remediation/ultimate-production-20260819"' dist/build-info.json
          git restore --source=HEAD -- functions/_lib/build-info.js
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Validate Pages configuration and Functions bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/northlight-pages-functions
          npx wrangler pages functions build functions --outdir=/tmp/northlight-pages-functions 2>&1 | tee /tmp/northlight-pages-build.log
          test -d /tmp/northlight-pages-functions
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Validate dispatcher bundle and Cloudflare bindings by dry run
        run: |
          set -euo pipefail
          npm run check:dispatcher 2>&1 | tee /tmp/northlight-dispatcher-dry-run.log

      - name: Verify final clean tree and production freeze
        run: |
          set -euo pipefail
          git diff --check
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$status" ]; then
            echo '::error::Unexpected authoritative checkout mutation remains:'
            printf '%s\n' "$status"
            exit 1
          fi
          prod="$(git ls-remote --heads origin refs/heads/northlight-production | awk '{print $1}')"
          remote_rc="$(git ls-remote --heads origin refs/heads/remediation/ultimate-production-20260819 | awk '{print $1}')"
          test "$prod" = "$EXPECTED_PRODUCTION"
          test "$remote_rc" = "$EXPECTED_HEAD"
          echo "Final production freeze: $prod"
          echo "Final authoritative remediation ref: $remote_rc"

      - name: Upload baseline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northlight-authoritative-baseline-${{ github.run_id }}
          path: |
            /tmp/northlight-tests.log
            /tmp/northlight-build.log
            /tmp/northlight-pages-build.log
            /tmp/northlight-dispatcher-dry-run.log
          if-no-files-found: ignore
          retention-days: 30
