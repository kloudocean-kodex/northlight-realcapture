name: Northlight DB Repository Source Proof

on:
  push:
    branches:
      - northlight-db-source-reconciliation-20260822
  pull_request:
    branches:
      - remediation/ultimate-production-20260819

permissions:
  contents: read

jobs:
  postgres17:
    name: PostgreSQL 17 checked-in source proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: northlight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d northlight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/northlight
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Attest remediation ancestry and non-production branch
        run: |
          set -euo pipefail
          base='31587ba1b0650804aa3ed7b4d6de182ceb1b52e4'
          git merge-base --is-ancestor "$base" HEAD
          test "${GITHUB_REF_NAME}" != 'northlight-production'
          echo "candidate_head=$(git rev-parse HEAD)"
          echo "remediation_base=$base"

      - name: Verify all checked-in reconciled source bytes
        run: |
          set -euo pipefail
          test -s supabase/reconciled-source.sha256
          test "$(wc -l < supabase/reconciled-source.sha256)" -eq 51
          test "$(awk '{print $2}' supabase/reconciled-source.sha256 | sort -u | wc -l)" -eq 51
          while read -r hash file; do
            case "$file" in
              supabase/compatibility-foundation/*|supabase/migrations/*|supabase/tests/*) ;;
              *) echo "::error::Non-allowlisted source path: $file"; exit 1;;
            esac
            test -f "$file"
          done < supabase/reconciled-source.sha256
          sha256sum --check --strict supabase/reconciled-source.sha256
          echo 'checked_in_source_hashes=51/51'

      - name: Reject credential-shaped material in checked-in DB source
        run: |
          set -euo pipefail
          mapfile -t files < <(awk '{print $2}' supabase/reconciled-source.sha256)
          ! grep -E 'cfut_[A-Za-z0-9_-]{20,}' "${files[@]}"
          ! grep -E 'sb_(secret|publishable)_[A-Za-z0-9_-]{20,}' "${files[@]}"
          ! grep -E 'eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' "${files[@]}"
          ! grep -E 'AKIA[0-9A-Z]{16}' "${files[@]}"
          ! grep -E 'gh[pousr]_[A-Za-z0-9]{30,}' "${files[@]}"
          echo 'checked_in_source_credential_shape_findings=0'

      - name: Assemble replay only from checked-in source
        run: |
          set -euo pipefail
          {
            printf '%s\n' '\set ON_ERROR_STOP on' '\echo NORTHLIGHT_REPOSITORY_SOURCE_REPLAY_BEGIN'
            while read -r hash file; do
              printf "\\echo 'BEGIN %s sha256=%s'\n" "$file" "$hash"
              printf '%s\n' '\set ON_ERROR_STOP on'
              cat "$file"
              printf "\n\\echo 'END %s'\n\n" "$file"
            done < supabase/reconciled-source.sha256
            printf '%s\n' '\echo NORTHLIGHT_REPOSITORY_SOURCE_REPLAY_COMPLETE'
          } > /tmp/northlight-repository-source-replay.sql
          test -s /tmp/northlight-repository-source-replay.sql
          echo "repository_replay_sha256=$(sha256sum /tmp/northlight-repository-source-replay.sql | awk '{print $1}')"

      - name: Verify PostgreSQL 17 server and client tooling
        run: |
          set -euo pipefail
          server_version="$(psql "$DATABASE_URL" -X -Atqc 'show server_version;')"
          echo "PostgreSQL server: $server_version"
          case "$server_version" in 17.*) ;; *) echo '::error::Expected PostgreSQL 17'; exit 1;; esac
          docker run --rm postgres:17 psql --version
          docker run --rm postgres:17 pg_dump --version
          docker run --rm postgres:17 pg_restore --version

      - name: Execute complete checked-in replay and contracts
        run: |
          set -euo pipefail
          docker run --rm --network host -v /tmp:/work:ro -e PGPASSWORD=postgres postgres:17 \
            psql -h 127.0.0.1 -U postgres -d northlight -X -v ON_ERROR_STOP=1 \
              -f /work/northlight-repository-source-replay.sql

      - name: Assert catalog and runtime-key hardening independently
        run: |
          set -euo pipefail
          relations="$(psql "$DATABASE_URL" -X -Atqc "select count(*) from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','northlight_private') and c.relkind in ('r','p','v','m','S','f');")"
          echo "catalog_relations=$relations"
          test "$relations" = '34'
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          do $assert$
          declare
            v_def text;
            v_plaintext_pattern boolean;
            v_hash_rows integer;
          begin
            select pg_catalog.pg_get_functiondef(p.oid)
              into v_def
              from pg_catalog.pg_proc p
              join pg_catalog.pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public'
               and p.proname = 'northlight_pilot_allowed'
               and pg_catalog.pg_get_function_identity_arguments(p.oid) = '';
            if v_def is null then raise exception 'northlight_pilot_allowed_missing'; end if;
            v_plaintext_pattern := v_def ~ $regex$in\s*\(\s*'[^']+'\s*,\s*'[^']+'\s*\)$regex$;
            if v_plaintext_pattern then raise exception 'pilot_key_plaintext_shape_survived'; end if;
            select count(*) into v_hash_rows from northlight_private.pilot_key_hashes;
            if v_hash_rows <> 2 then raise exception 'pilot_key_hash_count_%', v_hash_rows; end if;
          end
          $assert$;
          SQL

      - name: Logical backup and restore rehearsal
        run: |
          set -euo pipefail
          docker run --rm --network host -v /tmp:/work -e PGPASSWORD=postgres postgres:17 \
            pg_dump -h 127.0.0.1 -U postgres -d northlight --format=custom --no-owner --no-privileges --file=/work/northlight-repository-source.dump
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17 \
            createdb -h 127.0.0.1 -U postgres northlight_restore
          docker run --rm --network host -v /tmp:/work:ro -e PGPASSWORD=postgres postgres:17 \
            pg_restore -h 127.0.0.1 -U postgres -d northlight_restore --no-owner --no-privileges /work/northlight-repository-source.dump
          original="$(psql "$DATABASE_URL" -X -Atqc "select count(*) from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','northlight_private') and c.relkind in ('r','p','v','m','S','f');")"
          restored="$(psql postgresql://postgres:postgres@127.0.0.1:5432/northlight_restore -X -Atqc "select count(*) from pg_catalog.pg_class c join pg_catalog.pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','northlight_private') and c.relkind in ('r','p','v','m','S','f');")"
          echo "Catalog relation count original=$original restored=$restored"
          test "$original" = "$restored"

      - name: Execute checked-in concurrent-session contracts
        run: |
          set -euo pipefail
          test -x ci/northlight-db-concurrency.sh
          test -x ci/northlight-auth-migration-concurrency.sh
          DATABASE_URL="$DATABASE_URL" bash ci/northlight-db-concurrency.sh
          DATABASE_URL="$DATABASE_URL" bash ci/northlight-auth-migration-concurrency.sh

      - name: Final repository-source verdict
        run: echo NORTHLIGHT_REPOSITORY_SOURCE_PG17_PROOF_COMPLETE
