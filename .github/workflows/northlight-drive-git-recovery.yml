name: Northlight Drive Git Recovery Verification

on:
  push:
    branches:
      - northlight-combined-verify-20260821
  pull_request:
    branches:
      - northlight-production

permissions:
  contents: write

jobs:
  verify-drive-git:
    name: Verify exact Drive Git checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v6

      - name: Install Drive enumerator
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'gdown==6.1.0'
          gdown --version

      - name: Enumerate and download shared .git snapshot deterministically
        run: |
          set -euo pipefail
          rm -rf /tmp/northlight-drive-git
          mkdir -p /tmp/northlight-drive-git
          gdown 'https://drive.google.com/drive/folders/1wsoxgfPnj_svTxaCtb63FzE0U4g0L181' --folder --json --quiet > /tmp/northlight-drive-git-files.json
          count="$(jq 'length' /tmp/northlight-drive-git-files.json)"
          echo "Drive .git listing contains $count files"
          test "$count" -ge 200
          jq -r '.[] | [.url,.path] | @tsv' /tmp/northlight-drive-git-files.json |
          while IFS=$'\t' read -r url rel; do
            test -n "$url"
            test -n "$rel"
            id="${url##*=}"
            dest="/tmp/northlight-drive-git/$rel"
            mkdir -p "$(dirname "$dest")"
            ok=0
            for attempt in 1 2 3 4 5; do
              if curl --location --fail --silent --show-error --max-time 30 \
                "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
                -o "${dest}.part"; then
                mv "${dest}.part" "$dest"
                ok=1
                break
              fi
              rm -f "${dest}.part"
              sleep $((attempt * 2))
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Failed to download Drive file id=$id path=$rel"
              exit 1
            fi
          done

      - name: Verify checkpoint object graph without pushing
        run: |
          set -euo pipefail
          candidate="$(find /tmp/northlight-drive-git -type f -name HEAD -not -path '*/logs/*' -print -quit)"
          test -n "$candidate"
          gitdir="$(dirname "$candidate")"
          expected_branch='refs/heads/remediation/ultimate-production-20260819'
          expected_head='5f26a32c15bc7394ed2c7aee22b0c42ea3b180f5'
          expected_parent='1160cc20044b26a0017df1eb281198b416b9735d'
          expected_tree='9d2058d9f68b3bf8dac6755d94820cb6aaacabf2'
          expected_baseline_tree='f3827ce4c8107173e04044d9fe9b65e3b2f026f9'
          test "$(cat "$gitdir/HEAD")" = "ref: $expected_branch"
          test "$(cat "$gitdir/$expected_branch")" = "$expected_head"
          test "$(git --git-dir="$gitdir" cat-file -t "$expected_head")" = commit
          test "$(git --git-dir="$gitdir" cat-file -t "$expected_parent")" = commit
          test "$(git --git-dir="$gitdir" show -s --format=%P "$expected_head")" = "$expected_parent"
          test "$(git --git-dir="$gitdir" show -s --format=%T "$expected_head")" = "$expected_tree"
          test "$(git --git-dir="$gitdir" show -s --format=%T "$expected_parent")" = "$expected_baseline_tree"
          git --git-dir="$gitdir" fsck --no-reflogs --connectivity-only "$expected_head"
          echo "Exact local checkpoint object graph verified: $expected_head"
          echo "Checkpoint tree: $expected_tree"
          echo "Local baseline tree: $expected_baseline_tree"

      - name: Dry-run and publish only the exact remediation ref
        if: github.event_name == 'push' && github.ref == 'refs/heads/northlight-combined-verify-20260821'
        env:
          GH_RECOVERY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$(find /tmp/northlight-drive-git -type f -name HEAD -not -path '*/logs/*' -print -quit)"
          test -n "$candidate"
          gitdir="$(dirname "$candidate")"
          target_ref='refs/heads/remediation/ultimate-production-20260819'
          prod_ref='refs/heads/northlight-production'
          expected_head='5f26a32c15bc7394ed2c7aee22b0c42ea3b180f5'
          expected_prod='1c9696a463c2d12acf5b5ffe839bd8aa9d75f80f'
          remote_url="https://x-access-token:${GH_RECOVERY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git ls-remote --heads "$remote_url" | sort > /tmp/heads-before.txt
          prod_before="$(awk -v ref="$prod_ref" '$2 == ref {print $1}' /tmp/heads-before.txt)"
          target_before="$(awk -v ref="$target_ref" '$2 == ref {print $1}' /tmp/heads-before.txt)"
          test "$prod_before" = "$expected_prod"
          if [ -n "$target_before" ] && [ "$target_before" != "$expected_head" ]; then
            echo "::error::Ref $target_ref already exists at unexpected SHA $target_before"
            exit 1
          fi

          if [ "$target_before" = "$expected_head" ]; then
            echo "Exact remediation ref is already published; push is a no-op."
          else
            git --git-dir="$gitdir" push --dry-run "$remote_url" "$expected_head:$target_ref"
            git --git-dir="$gitdir" push "$remote_url" "$expected_head:$target_ref"
          fi

          git ls-remote --heads "$remote_url" | sort > /tmp/heads-after.txt
          prod_after="$(awk -v ref="$prod_ref" '$2 == ref {print $1}' /tmp/heads-after.txt)"
          target_after="$(awk -v ref="$target_ref" '$2 == ref {print $1}' /tmp/heads-after.txt)"
          test "$prod_after" = "$expected_prod"
          test "$target_after" = "$expected_head"

          grep -vF "$(printf '\t%s' "$target_ref")" /tmp/heads-before.txt > /tmp/heads-before-other.txt || true
          grep -vF "$(printf '\t%s' "$target_ref")" /tmp/heads-after.txt > /tmp/heads-after-other.txt || true
          diff -u /tmp/heads-before-other.txt /tmp/heads-after-other.txt

          echo "Published exact remediation ref: $target_after"
          echo "Production ref remained frozen: $prod_after"
          echo "No unrelated branch ref changed during recovery publish."
