name: Northlight CI

on:
  push:
    branches:
      - northlight-production
      - 'northlight-certification-*'
      - 'northlight-hardening-*'
  pull_request:
    branches: [northlight-production]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and syntax-check all JavaScript
        run: npm run build

      - name: Run production certification contracts
        run: npm test

      - name: Verify Cloudflare production release attestation
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'northlight-production')
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            expected="$PR_BASE_SHA"
          else
            expected="$CURRENT_SHA"
          fi
          base='https://northlight-realcapture.pages.dev'
          for attempt in $(seq 1 18); do
            health="$(curl --fail --silent --show-error --max-time 15 "$base/api/health" || true)"
            build="$(curl --fail --silent --show-error --max-time 15 "$base/build-info.json" || true)"
            if [ -n "$health" ] && [ -n "$build" ]; then
              health_sha="$(node -e 'try{const d=JSON.parse(process.argv[1]);process.stdout.write(String(d?.deployment?.commitSha||""))}catch{}' "$health")"
              build_sha="$(node -e 'try{const d=JSON.parse(process.argv[1]);process.stdout.write(String(d?.commitSha||""))}catch{}' "$build")"
              branch="$(node -e 'try{const d=JSON.parse(process.argv[1]);process.stdout.write(String(d?.deployment?.branch||""))}catch{}' "$health")"
              echo "Attempt $attempt: health=$health_sha build=$build_sha branch=$branch expected=$expected"
              if [ "$health_sha" = "$expected" ] && [ "$build_sha" = "$expected" ]; then
                echo "Cloudflare production attested exact Northlight commit $expected"
                exit 0
              fi
            else
              echo "Attempt $attempt: production endpoint not ready"
            fi
            sleep 10
          done
          echo "::error::Cloudflare production did not attest expected commit $expected"
          exit 1
