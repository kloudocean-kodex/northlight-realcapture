name: Northlight CI

on:
  push:
    branches:
      - northlight-production
      - 'northlight-certification-*'
      - 'northlight-hardening-*'
  pull_request:
    branches: [northlight-production]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and syntax-check all JavaScript
        run: npm run build

      - name: Run production certification contracts
        run: npm test
