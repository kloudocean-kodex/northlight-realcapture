name: Northlight One-Time Manifest Correction

on:
  push:
    branches:
      - northlight-combined-verify-20260821

permissions:
  contents: write

jobs:
  correct-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHECKPOINT: 5f26a32c15bc7394ed2c7aee22b0c42ea3b180f5
      FROZEN_PRODUCTION: 1c9696a463c2d12acf5b5ffe839bd8aa9d75f80f
      STALE_HASH: fe0a2794f55e678ab2468f1c5ec08b1516e6a83621a26869569e9622e229597f
      AUTHORITATIVE_HASH: 1b67f9872e335622385d1469b4ef2e08269181ec693e72e8f012408108ab8983
    steps:
      - name: Checkout exact authoritative remediation checkpoint
        uses: actions/checkout@v6
        with:
          ref: remediation/ultimate-production-20260819
          fetch-depth: 0

      - name: Assert immutable starting state and production freeze
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'remediation/ultimate-production-20260819'
          test "$(git rev-parse HEAD)" = "$CHECKPOINT"
          test "$(git ls-remote --heads origin refs/heads/remediation/ultimate-production-20260819 | awk '{print $1}')" = "$CHECKPOINT"
          test "$(git ls-remote --heads origin refs/heads/northlight-production | awk '{print $1}')" = "$FROZEN_PRODUCTION"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prove defect and replace only the stale digest
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const contractPath = 'supabase/schema-contract.json';
          const migrationPath = 'supabase/migrations/20260821142000_northlight_same_tenant_integrity.sql';
          const migrationName = '20260821142000_northlight_same_tenant_integrity.sql';
          const stale = process.env.STALE_HASH;
          const authoritative = process.env.AUTHORITATIVE_HASH;
          const migration = fs.readFileSync(migrationPath);
          const digest = crypto.createHash('sha256').update(migration).digest('hex');
          if (digest !== authoritative) throw new Error(`unexpected_migration_digest:${digest}`);
          const raw = fs.readFileSync(contractPath, 'utf8');
          const contract = JSON.parse(raw);
          if (contract.localCandidateMigrationSha256?.[migrationName] !== stale) {
            throw new Error('manifest_not_in_expected_stale_state');
          }
          const from = `"${migrationName}": "${stale}"`;
          const to = `"${migrationName}": "${authoritative}"`;
          if (raw.split(from).length !== 2) throw new Error('stale_digest_occurrence_not_exactly_one');
          fs.writeFileSync(contractPath, raw.replace(from, to));
          const corrected = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          if (corrected.localCandidateMigrationSha256[migrationName] !== authoritative) {
            throw new Error('manifest_correction_failed');
          }
          console.log(`Verified authoritative migration SHA-256: ${digest}`);
          NODE
          test "$(git diff --name-only)" = 'supabase/schema-contract.json'
          test "$(git diff --numstat | awk '{print $1":"$2":"$3}')" = '1:1:supabase/schema-contract.json'
          git diff --check

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full test suite after correction
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/manifest-correction-tests.log
          grep -E '^# (tests|pass|fail|skipped|cancelled|todo) ' /tmp/manifest-correction-tests.log

      - name: Run build and JavaScript syntax checks
        run: npm run build

      - name: Run Cloudflare dispatcher dry-run compile
        run: npm run check:dispatcher

      - name: Prove correction remains exactly one tracked-line change
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = 'supabase/schema-contract.json'
          test "$(git diff --numstat | awk '{print $1":"$2":"$3}')" = '1:1:supabase/schema-contract.json'
          unexpected="$(git status --porcelain=v1 --untracked-files=all | grep -v '^ M supabase/schema-contract.json$' || true)"
          test -z "$unexpected"
          test "$(git ls-remote --heads origin refs/heads/remediation/ultimate-production-20260819 | awk '{print $1}')" = "$CHECKPOINT"
          test "$(git ls-remote --heads origin refs/heads/northlight-production | awk '{print $1}')" = "$FROZEN_PRODUCTION"

      - name: Commit and normal fast-forward push only the remediation branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/schema-contract.json
          git commit -m 'fix(db): refresh same-tenant migration manifest hash'
          new_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^1)" = "$CHECKPOINT"
          git push origin HEAD:refs/heads/remediation/ultimate-production-20260819
          remote_head="$(git ls-remote --heads origin refs/heads/remediation/ultimate-production-20260819 | awk '{print $1}')"
          prod="$(git ls-remote --heads origin refs/heads/northlight-production | awk '{print $1}')"
          test "$remote_head" = "$new_head"
          test "$prod" = "$FROZEN_PRODUCTION"
          echo "Corrected remediation HEAD=$new_head"
          echo "Frozen production HEAD=$prod"
